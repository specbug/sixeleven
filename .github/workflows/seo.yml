name: SEO and browser checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  seo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bunx playwright install --with-deps chromium
      - run: bun run build
      - run: bun run test:seo
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: seo-browser-results
          path: test-results/
          retention-days: 7
